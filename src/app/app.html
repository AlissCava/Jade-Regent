<div class="app-layout">
  <!-- Navbar Fissa in Alto -->
  <header class="navbar">
    <a routerLink="/" class="nav-brand">
      <span class="brand-icon">🏯</span>
      <span class="brand-name">Jade Regent</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        🏠 Home
      </a>
      <a routerLink="/wild-shapes" routerLinkActive="active" class="nav-item">
        🌿 Bestiario
      </a>
      <a routerLink="/spells" routerLinkActive="active" class="nav-item">
        📜 Grimorio
      </a>
    </nav>
  </header>

  <!-- Qui dentro Angular carica dinamicamente la pagina attiva -->
  <main class="page-viewport">
    <router-outlet></router-outlet>
  </main>
</div>
