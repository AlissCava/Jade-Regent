<!-- HEADER SUPERIORE: LOGO + PULSANTE INGRANDIMENTO TESTO -->
<header class="app-header">
  <div class="header-container">
    <a routerLink="/" class="app-logo">
      <span class="logo-icon">⛩️</span>
      <span class="logo-text">JADE REGENT</span>
    </a>

    <!-- PULSANTE SINGOLO PER INGRANDIRE IL TESTO -->
    <button 
      type="button" 
      class="text-scale-btn" 
      [class.scaled]="textScale() > 100"
      (click)="cycleTextScale()" 
      [attr.aria-label]="'Dimensione testo attuale: ' + textScale() + ' percento. Clicca per ingrandire'"
      title="Clicca per ingrandire le scritte (100% -> 120% -> 140%)">
      <span class="scale-symbol">Aa</span>
      <span class="scale-indicator">{{ textScale() }}%</span>
    </button>
  </div>
</header>

<!-- CONTENUTO PRINCIPALE -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>

<!-- BOTTOM NAVIGATION BAR (SNELLA) -->
<nav class="bottom-nav-bar" aria-label="Navigazione principale">
  <button 
    type="button" 
    class="bottom-nav-btn burger-bottom-btn" 
    (click)="toggleMenu()" 
    [attr.aria-expanded]="isMenuOpen()" 
    aria-label="Apri menu">
    <span class="btn-icon">☰</span>
    <span class="btn-label">Menu</span>
  </button>

  <a routerLink="/spells" class="bottom-nav-btn" routerLinkActive="active" aria-label="Grimorio">
    <span class="btn-icon">📜</span>
    <span class="btn-label">Grimorio</span>
  </a>

    <a routerLink="/wild-shapes" class="bottom-nav-btn" routerLinkActive="active" aria-label="Forme">
    <span class="btn-icon">🐾</span>
    <span class="btn-label">Forme</span>
  </a>
</nav>

  <a routerLink="/chronicles" class="bottom-nav-btn" routerLinkActive="active" aria-label="Cronache">
    <span class="btn-icon">📖</span>
    <span class="btn-label">Diario</span>
  </a>

  <a routerLink="/characters" class="bottom-nav-btn" routerLinkActive="active" aria-label="Party">
    <span class="btn-icon">👥</span>
    <span class="btn-label">Party</span>
  </a>


<!-- MENU A CASSETTO (DRAWER) -->
<div class="menu-overlay" *ngIf="isMenuOpen()" (click)="closeMenu()">
  <aside class="menu-drawer" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Menu completo">
    <div class="drawer-header">
      <div class="drawer-title">
        <span class="icon">⛩️</span>
        <span>Caravan Codex</span>
      </div>
      <button type="button" class="close-drawer-btn" (click)="closeMenu()" aria-label="Chiudi menu">✕</button>
    </div>

    <nav class="drawer-links">
      <a routerLink="/" (click)="closeMenu()" class="drawer-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <span class="link-icon">🏠</span>
        <span class="link-text">Home / Accampamento</span>
      </a>
      <a routerLink="/characters" (click)="closeMenu()" class="drawer-link" routerLinkActive="active">
        <span class="link-icon">👥</span>
        <span class="link-text">Eroi del Party</span>
      </a>
      <a routerLink="/character" (click)="closeMenu()" class="drawer-link" routerLinkActive="active">
        <span class="link-icon">⚔️</span>
        <span class="link-text">Scheda Ryoujin & Hisui</span>
      </a>
      <a routerLink="/spells" (click)="closeMenu()" class="drawer-link" routerLinkActive="active">
        <span class="link-icon">📜</span>
        <span class="link-text">Grimorio Incantesimi</span>
      </a>
      <a routerLink="/wild-shapes" (click)="closeMenu()" class="drawer-link" routerLinkActive="active">
        <span class="link-icon">🐾</span>
        <span class="link-text">Forme Selvatica • Airyn</span>
      </a>
      <a routerLink="/chronicles" (click)="closeMenu()" class="drawer-link" routerLinkActive="active">
        <span class="link-icon">📖</span>
        <span class="link-text">Cronache della Carovana</span>
      </a>
    </nav>
  </aside>
</div>
