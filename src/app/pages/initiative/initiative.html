<div class="initiative-container">
  <!-- INTESTAZIONE: TITOLO ROUND E AZIONI RAPIDE -->
  <header class="tracker-header">
    <div class="round-badge">
      <span class="round-icon">⏱️</span>
      <span class="round-label">ROUND <strong>{{ currentRound() }}</strong></span>
    </div>

    <div class="header-actions">
      <button type="button" class="btn-step" (click)="prevTurn()" title="Turno precedente">◀ Prec</button>
      <button type="button" class="btn-step btn-next-highlight" (click)="nextTurn()" title="Prossimo turno">Prossimo ➔</button>
      <button type="button" class="btn-action" (click)="sortCombatants()" title="Riordina per iniziativa">⚡ Ordina</button>
      <button type="button" class="btn-reset" (click)="resetCombat()" title="Azzera combattimento">🔄 Reset</button>
    </div>
  </header>

  <!-- FORM RAPIDO: SELETTORE NEMICO / ALLEATO -->
  <section class="enemy-creator-box" [class.is-ally-box]="newCombatantType === 'ally'">
    <div class="creator-header">
      <div class="box-title">
        <span *ngIf="newCombatantType === 'enemy'">⚔️ INSERISCI NEMICO</span>
        <span *ngIf="newCombatantType === 'ally'">🛡️ INSERISCI ALLEATO</span>
      </div>

      <!-- TASTI TOGGLE NEMICO / ALLEATO -->
      <div class="type-toggle-group">
        <button 
          type="button" 
          class="btn-type-toggle toggle-enemy" 
          [class.active]="newCombatantType === 'enemy'" 
          (click)="setNewCombatantType('enemy')">
          🔴 Nemico
        </button>
        <button 
          type="button" 
          class="btn-type-toggle toggle-ally" 
          [class.active]="newCombatantType === 'ally'" 
          (click)="setNewCombatantType('ally')">
          🟢 Alleato
        </button>
      </div>
    </div>

    <form (ngSubmit)="addCombatant()" class="enemy-form">
      <input 
        type="text" 
        [(ngModel)]="newEnemyName" 
        name="enemyName" 
        [placeholder]="newCombatantType === 'enemy' ? 'Nome (es. Goblin 1, Lupo Leader)...' : 'Nome (es. Guardia, Chierico alleato)...'" 
        (focus)="touchUserActivity()"
        required />

      <div class="init-input-wrap">
        <label>Iniz:</label>
        <input 
          type="number" 
          [(ngModel)]="newEnemyInit" 
          name="enemyInit" 
          (focus)="touchUserActivity()"
          required />
      </div>

      <button 
        type="submit" 
        class="btn-add-enemy"
        [class.btn-add-ally]="newCombatantType === 'ally'">
        + Aggiungi
      </button>
    </form>
  </section>

  <!-- LISTA ORDINATA DEI COMBATTENTI -->
  <div class="combatants-list">
    <article 
      *ngFor="let c of combatants(); let i = index" 
      class="combatant-card"
      [class.active-turn]="i === activeTurnIndex()"
      [class.card-enemy]="c.type === 'enemy'"
      [class.card-ally]="c.type === 'ally'"
      [class.card-pc]="c.type === 'pc'"
      [class.card-npc]="c.type === 'npc'"
      [class.is-defeated]="c.is_ko">

      <!-- RIGA SUPERIORE CARD: NUMERO, NOME, BADGE E INIZIATIVA -->
      <div class="card-top-row">
        <div class="left-col">
          <button 
            *ngIf="i === activeTurnIndex()" 
            type="button" 
            class="turn-badge-btn" 
            (click)="nextTurn()" 
            title="È il suo turno! Clicca per passare al prossimo">
            <span class="pulse-play">▶</span> TURNO <span class="pass-hint">Passa ▸</span>
          </button>

          <span class="index-badge" *ngIf="i !== activeTurnIndex()">#{{ i + 1 }}</span>

          <span class="combatant-name">{{ c.name }}</span>

          <!-- BADGE TIPO COMBATTENTE -->
          <span class="type-pill pill-enemy" *ngIf="c.type === 'enemy'">NEMICO</span>
          <span class="type-pill pill-ally" *ngIf="c.type === 'ally'">ALLEATO</span>
          <span class="type-pill pill-pc" *ngIf="c.type === 'pc'">PG</span>
          <span class="type-pill pill-npc" *ngIf="c.type === 'npc'">CAROVANA</span>
        </div>

        <div class="right-col">
          <div class="init-value-box">
            <span class="init-lbl">Iniziativa:</span>
            <!-- INPUT PROTETTO: NON SI RESETTA MENTRE DIGITI -->
            <input 
              type="number" 
              class="init-input" 
              [ngModel]="c.initiative" 
              (ngModelChange)="onInitiativeInput(c, $event)"
              (focus)="onInputFocus(c.id)"
              (blur)="onInitiativeBlur(c)"
              (keydown.enter)="$event.target.blur()"
              [readonly]="c.type === 'npc'" />
          </div>

          <!-- Pulsante elimina per nemici ed alleati aggiunti al volo -->
          <button 
            *ngIf="c.type === 'enemy' || c.type === 'ally'" 
            type="button" 
            class="btn-delete" 
            (click)="removeCombatant(c.id)" 
            title="Rimuovi">✕</button>
        </div>
      </div>

      <!-- NOTA PER GLI NPC DELLA CAROVANA -->
      <div class="npc-note" *ngIf="c.type === 'npc'">
        <em>Agisce a fine round con la carovana</em>
      </div>

      <!-- PANNELLO DANNI SUBITI IN ROSSO ACCESO (PER NEMICI, ALLEATI E CAROVANA) -->
      <div class="damage-panel" *ngIf="c.type === 'enemy' || c.type === 'npc' || c.type === 'ally'">
        <div class="damage-status-line">
          <div class="damage-counter">
            <span class="lbl">DANNI SUBITI:</span>
            <span class="val">{{ c.damage || 0 }}</span>
          </div>

          <div class="ko-actions">
            <button 
              *ngIf="!c.is_ko" 
              type="button" 
              class="btn-ko" 
              (click)="setKo(c, true)">
              KO / A Terra
            </button>
            <button 
              *ngIf="c.is_ko" 
              type="button" 
              class="btn-revive" 
              (click)="setKo(c, false)">
              Rianima
            </button>
          </div>
        </div>

        <!-- CONTROLLI RAPIDI DANNI CON INPUT IN ROSSO -->
        <div class="damage-controls-row">
          <button type="button" class="btn-dmg-quick" (click)="addQuickDamage(c, 1)">+1</button>
          <button type="button" class="btn-dmg-quick" (click)="addQuickDamage(c, 5)">+5</button>
          <button type="button" class="btn-dmg-quick" (click)="addQuickDamage(c, 10)">+10</button>
          <button type="button" class="btn-dmg-quick btn-heal" (click)="addQuickDamage(c, -5)">-5</button>

          <!-- INPUT DANNO DA INFLIGGERE IN ROSSO -->
          <input 
            type="number" 
            class="input-custom-dmg" 
            [(ngModel)]="c.tempDamageInput" 
            (focus)="onInputFocus(c.id)"
            (blur)="touchUserActivity()"
            (keydown.enter)="applyInputDamage(c)"
            placeholder="0" />

          <button type="button" class="btn-apply-dmg" (click)="applyInputDamage(c)">Infliggi</button>
        </div>
      </div>
    </article>
  </div>
</div>
