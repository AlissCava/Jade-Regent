<div class="characters-container">
  <!-- HEADER COMPATTO -->
  <header class="characters-header">
    <div class="campaign-pill">Pathfinder 1E • Jade Regent</div>
    <h1 class="main-title">⚔️ Gli Eroi della Carovana</h1>
    <p class="subtitle">Seleziona un personaggio per aprire la scheda interattiva e gestire le statistiche.</p>
  </header>

  <!-- GRIGLIA EROI (2 COLONNE SU MOBILE, 3 SU DESKTOP) -->
  <div class="modules-grid">
    <a 
      *ngFor="let hero of characters" 
      [routerLink]="['/characters', hero.slug]" 
      class="module-card">
      
      <!-- ICONA COLORATA -->
      <div class="card-icon-wrap" [ngClass]="hero.theme">
        <span class="icon">{{ hero.icon }}</span>
      </div>

      <!-- CONTENUTO SCHEDA -->
      <div class="card-content">
        <div class="card-tag">Livello {{ hero.level }} • {{ hero.race }}</div>
        <h2 class="card-title">
          {{ hero.name }} <span class="kanji" *ngIf="hero.kanji">({{ hero.kanji }})</span>
        </h2>
        <div class="card-class">{{ hero.className }}</div>
        <p class="card-desc">{{ hero.subtitle }}</p>
      </div>

      <div class="card-action-hint">Apri Scheda ➔</div>
    </a>
  </div>
</div>
